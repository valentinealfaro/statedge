<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d12" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="StatEdge" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Open Graph image: the brand logo. Same image for every route
         since we're an SPA without SSR. -->
    <meta property="og:image" content="https://statedge-frontend.vercel.app/statedge-logo.png" />
    <meta property="og:image:width" content="1536" />
    <meta property="og:image:height" content="1024" />
    <meta name="twitter:image" content="https://statedge-frontend.vercel.app/statedge-logo.png" />

    <title>StatEdge — NBA stats comparison</title>
    <meta
      name="description"
      content="Compare NBA players and teams: trends, consistency, last-10 game logs, and prop-line hit probability. Statistics and analysis only — no betting advice."
    />

    <!-- Open Graph / social previews — these stay constant for every URL
         since this is an SPA without SSR. Once we add edge-rendered OG
         images per matchup these can become dynamic. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="StatEdge" />
    <meta property="og:title" content="StatEdge — NBA stats comparison" />
    <meta
      property="og:description"
      content="Compare NBA players and teams. Trends, consistency, last-10 game logs, and prop-line hit probability."
    />
    <meta property="og:url" content="https://statedge-frontend.vercel.app/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="StatEdge — NBA stats comparison" />
    <meta
      name="twitter:description"
      content="Compare NBA players and teams. Trends, consistency, last-10 game logs, and prop-line hit probability."
    />

    <link rel="canonical" href="https://statedge-frontend.vercel.app/" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
